<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Tracker d'Activités</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #bb86fc; --fav: #ffd700; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; padding-bottom: 50px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { margin: 0 0 20px 0; font-size: 1.5rem; color: var(--accent); text-transform: capitalize; }
        label { display: block; margin-top: 20px; font-weight: bold; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #2c2c2c; color: white; box-sizing: border-box; margin-top: 8px; }
        
        /* Banques de données (Personnes et Lieux) */
        .bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .tag { padding: 8px 12px; background: #333; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; border: 1px solid transparent; }
        .tag.selected { background: var(--accent); color: black; font-weight: bold; }
        .tag.favorite { border-color: var(--fav); }
        .star { color: #555; font-size: 1.1rem; }
        .star.active { color: var(--fav); }

        button.save-btn { width: 100%; padding: 18px; background: var(--accent); border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-top: 30px; cursor: pointer; color: black; }
        
        .history-item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 5px solid var(--accent); }
        .history-item small { color: #aaa; display: block; margin-top: 5px; }
        .section-title { margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="today">Date</h1>
        
        <label>1. Qu'as-tu fait ? (Activité)</label>
        <input type="text" id="action" placeholder="Ex: Tournage, DJ Set, Souper...">

        <label>2. Quel événement ? (Optionnel)</label>
        <input type="text" id="event" placeholder="Ex: Drag Race, Pixel Fête, 30 ans...">

        <label>3. Avec qui ?</label>
        <input type="text" id="whoInput" placeholder="Ajouter une personne + Entrée" onkeypress="if(event.key === 'Enter') addItem('people')">
        <div id="rec-people" class="bank"></div>
        <div id="others-people" class="bank"></div>

        <label>4. Où ça ?</label>
        <input type="text" id="whereInput" placeholder="Ajouter un lieu + Entrée" onkeypress="if(event.key === 'Enter') addItem('places')">
        <div id="rec-places" class="bank"></div>
        <div id="others-places" class="bank"></div>

        <button class="save-btn" onclick="saveEntry()">ENREGISTRER LA JOURNÉE</button>
    </div>

    <h3 class="section-title">Derniers souvenirs</h3>
    <div id="history"></div>

    <script>
        // Banques de données
        let dbs = {
            people: JSON.parse(localStorage.getItem('peopleDB') || "[]"),
            places: JSON.parse(localStorage.getItem('placesDB') || "[]")
        };
        
        let selected = { people: [], places: [] };

        function init() {
            const dateStr = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
            document.getElementById('today').innerText = dateStr;
            renderBank('people');
            renderBank('places');
            displayHistory();
        }

        // Ajouter à la banque (Personnes ou Lieux)
        function addItem(type) {
            const input = document.getElementById(type + 'Input');
            const val = input.value.trim();
            if(val && !dbs[type].find(item => item.name === val)) {
                dbs[type].push({ name: val, fav: false });
                localStorage.setItem(type + 'DB', JSON.stringify(dbs[type]));
            }
            input.value = "";
            renderBank(type);
        }

        function toggleFav(type, name, event) {
            event.stopPropagation();
            const item = dbs[type].find(i => i.name === name);
            item.fav = !item.fav;
            localStorage.setItem(type + 'DB', JSON.stringify(dbs[type]));
            renderBank(type);
        }

        function toggleSelect(type, name) {
            const index = selected[type].indexOf(name);
            if(index > -1) selected[type].splice(index, 1);
            else {
                if(type === 'places') selected[type] = [name]; // Un seul lieu à la fois généralement
                else selected[type].push(name);
            }
            renderBank(type);
        }

        function renderBank(type) {
            const recDiv = document.getElementById('rec-' + type);
            const otherDiv = document.getElementById('others-' + type);
            
            const favs = dbs[type].filter(i => i.fav).slice(0, 3);
            const others = dbs[type].filter(i => !favs.includes(i));

            const createTag = (i) => `
                <div class="tag ${selected[type].includes(i.name) ? 'selected' : ''} ${i.fav ? 'favorite' : ''}" onclick="toggleSelect('${type}', '${i.name}')">
                    ${i.name}
                    <span class="star ${i.fav ? 'active' : ''}" onclick="toggleFav('${type}', '${i.name}', event)">★</span>
                </div>
            `;

            recDiv.innerHTML = favs.map(createTag).join('');
            otherDiv.innerHTML = others.map(createTag).join('');
        }

        function saveEntry() {
            const entry = {
                date: new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'short'}),
                action: document.getElementById('action').value,
                event: document.getElementById('event').value,
                who: selected.people.join(', '),
                where: selected.places.join(', ')
            };

            if(!entry.action) return alert("Qu'as-tu fait aujourd'hui ?");

            let history = JSON.parse(localStorage.getItem('myEvents') || "[]");
            history.unshift(entry);
            localStorage.setItem('myEvents', JSON.stringify(history));

            // Reset des champs
            document.getElementById('action').value = "";
            document.getElementById('event').value = "";
            selected = { people: [], places: [] };
            renderBank('people');
            renderBank('places');
            displayHistory();
        }

        function displayHistory() {
            const history = JSON.parse(localStorage.getItem('myEvents') || "[]");
            document.getElementById('history').innerHTML = history.map(e => `
                <div class="history-item">
                    <strong>${e.date} — ${e.action}</strong>
                    ${e.event ? `<br><span style="color:var(--accent)">🎫 ${e.event}</span>` : ''}
                    <small>👥 ${e.who || 'Seul(e)'} <br>📍 ${e.where || 'Non précisé'}</small>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
